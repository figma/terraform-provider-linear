mutation updateTeam(
  $input: TeamUpdateInput!,
  $id: String!
) {
  teamUpdate(input: $input, id: $id) {
    team {
      ...Team
    }
  }
}

mutation makeTeamPrivate($id: String!) {
  teamUpdate(id: $id, input: {private: true}) {
    team {
      id
      private
    }
  }
}
