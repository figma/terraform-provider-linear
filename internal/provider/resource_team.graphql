# @genqlient(for: "Team.description", pointer: true)
# @genqlient(for: "Team.icon", pointer: true)
# @genqlient(for: "Team.color", pointer: true)
# @genqlient(for: "Team.autoClosePeriod", pointer: true)
# @genqlient(for: "Team.parent", pointer: true)
fragment Team on Team {
  id
  name
  key
  private
  description
  icon
  color
  parent {
    id
  }
  inheritIssueEstimation
  inheritWorkflowStatuses
  timezone
  groupIssueHistory
  setIssueSortOrderOnStateChange
  aiThreadSummariesEnabled
  autoArchivePeriod
  autoClosePeriod
  autoCloseParentIssues
  autoCloseChildIssues
  triageEnabled
  requirePriorityToLeaveTriage
  cyclesEnabled
  cycleStartDay
  cycleDuration
  cycleCooldownTime
  upcomingCycleCount
  cycleIssueAutoAssignStarted
  cycleIssueAutoAssignCompleted
  cycleLockToActive
  issueEstimationType
  issueEstimationAllowZero
  issueEstimationExtended
  defaultIssueEstimate
  securitySettings
}

query getTeam($key: String!) {
  administrableTeams(filter: {key: {eq: $key}}, first: 1, includeArchived: true) {
    nodes {
      ...Team
    }
  }
}

query getTeamByID($id: ID!) {
  administrableTeams(filter: {id: {eq: $id}}, first: 1, includeArchived: true) {
    nodes {
      ...Team
    }
  }
}

